name: Release

# Tag vX.Y.Z → build + publish `axor-lab` to PyPI. Credential-free by design,
# the same arrangement the Control Plane uses: PyPI Trusted Publishing (OIDC),
# so no API token ever lives in the repo. Runbook: docs/RELEASING.md.
#
# `workflow_dispatch` on a branch is a DRY RUN: everything builds and every
# check runs, and the publish leg is skipped because the ref is not a tag. Use
# it to rehearse a release without spending a version number — Lab cannot be
# published today (two dependencies are git pins; the preflight says so), and
# finding that out from a dispatch costs nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Two tags pushed together must not race for the same version on PyPI.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Build, install clean-room, and refuse a release PyPI would reject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: twine check (long_description renders on the project page)
        run: twine check dist/*

      # Runs BEFORE the preflight gate on purpose. The gate below fails today
      # on the two git-pinned dependencies, and stopping there would tell you
      # nothing about whether the artefact itself is sound. This step answers
      # the question that actually matters to a user — does `pip install` give
      # them a working `axor-lab`? — and it is the same assertion the CI
      # `packaging` job makes, run here against the exact files being uploaded.
      - name: Clean-room install of the built wheel, outside the source tree
        run: |
          python -m venv /tmp/release-venv
          /tmp/release-venv/bin/pip install --no-cache-dir dist/*.whl
          # from / with no AXOR_LAB_CONTRACTS and no contracts/ nearby: the
          # schemas must come from package data, and every package the CLI
          # imports at module level must actually be in the wheel.
          cd / && /tmp/release-venv/bin/python -c "
          from lab_contracts import load_schemas
          s = load_schemas(); assert set(s) >= {'trace','bundle','scenario'}, s
          print('schemas loaded from package data:', len(s))
          "
          cd / && /tmp/release-venv/bin/axor-lab --help >/dev/null
          cd / && /tmp/release-venv/bin/axor-lab report --help >/dev/null
          echo 'console script + the lab_service verbs resolve from the wheel'

      # The gate. A direct-URL dependency is a 400 from PyPI on upload, and a
      # dependency that is not on PyPI is a broken install for everyone — both
      # are silent until it is too late, so they fail here with the remedy.
      - name: Preflight — PyPI would accept this, and it would resolve
        run: |
          python tools/release_preflight.py \
            --dist dist \
            --tag "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Hand the exact built files to the publish leg
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pypi:
    name: Publish to PyPI (trusted publishing)
    needs: preflight
    # A dispatch dry run gets everything above and stops here.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      # Publish the artefacts the preflight actually checked. Rebuilding here
      # would upload files nothing in this workflow has verified.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # A re-run (a re-tag to pick up a fix) then skips an already-published
          # version instead of failing the whole workflow.
          skip-existing: true
