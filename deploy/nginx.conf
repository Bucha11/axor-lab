# The edge for a self-hosted Axor Lab. It exists for the two things the app
# deliberately does not do itself: terminate TLS, and refuse abusive traffic.

# Two buckets, because the routes differ in what abuse costs.
#   api   — ordinary reads and writes, already bearer-gated.
#   guest — POST /guest-session mints a workspace for an ANONYMOUS caller, so it
#           is the one route where a stranger can consume resources. Tight, and
#           it still only matters when AXOR_LAB_GUEST_SESSIONS=1.
limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=guest:1m  rate=6r/m;
#   login — /identity/* is where passwords are tried; a credential-stuffing
#           budget, not an API one.
limit_req_zone $binary_remote_addr zone=login:1m  rate=10r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=conns:10m;

upstream lab {
    server lab:8871;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    # ── TLS ──────────────────────────────────────────────────────────────────
    # Put fullchain.pem + privkey.pem in deploy/certs, then replace the `listen`
    # line above with these three and publish 8443 in compose:
    #   listen 8443 ssl;
    #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # Until then this is plain HTTP and must not face the internet.

    client_max_body_size 64m;   # a bundle upload is the large request here
    limit_conn conns 64;

    # Do not advertise the version to a scanner.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # The live-run event stream. Buffering here would hold events until the
    # response closed, which for an SSE stream means "never" — the run would
    # appear frozen in the browser while the server was streaming it correctly.
    location ~ ^/runs/[^/]+/events$ {
        proxy_pass http://lab;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        limit_req zone=api burst=40 nodelay;
    }

    location = /guest-session {
        limit_req zone=guest burst=3 nodelay;
        proxy_pass http://lab;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Human login. The web app calls axor-identity at `/identity/v1/*` on THIS
    # origin (VITE_IDENTITY_URL defaults to `/identity`), and without this block
    # that path fell through to the Lab, which has no such route — so every
    # sign-in on a deployed Lab answered 404 while the dev proxy worked.
    #
    # The prefix is stripped, as the control plane's edge does, so the request
    # reaches `/v1/*` on the identity service. The upstream is resolved at
    # REQUEST time (a variable + Docker's resolver), so a deployment that runs no
    # identity service still starts: sign-in answers 502 there, and /auth/status
    # already tells the app not to offer it. Point `identity:8402` at wherever
    # axor-identity runs, and set AXOR_LAB_IDENTITY_JWKS_URL for the Lab.
    location /identity/ {
        limit_req zone=login burst=5 nodelay;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $identity_upstream http://identity:8402;
        rewrite ^/identity/(.*)$ /$1 break;
        proxy_pass $identity_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://lab;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A run assignment or a bundle upload can outlast the default 60s.
        proxy_read_timeout 300s;
    }
}
