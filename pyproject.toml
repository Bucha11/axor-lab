[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axor-lab"
version = "0.1.0"
description = "Axor Lab — reproducible governance experiments for AI agents: local runner, exact replay, EvidenceCase, regression pinning"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# axor-core is REQUIRED, not an extra. Lab exists to measure what the Axor
# kernel does; a Lab that installs without it can still run, but every number it
# produces describes the one-gate reference reimplementation rather than the
# product — and which of the two you got depended on whether an optional extra
# happened to be installed. Bounded to one minor line, matching axor-wrap, so an
# environment cannot resolve a kernel Lab's integration job never ran against.
#
# Everything else stays stdlib: the contract validator, replay and the
# statistics engine pull in nothing.
dependencies = ["axor-core>=0.10,<0.11"]

[project.scripts]
axor-lab = "lab_runner.cli:main"

[tool.setuptools]
packages = [
    "lab_contracts",
    "lab_analysis",
    "lab_runner",
    "lab_adapters",
    "lab_server",
    "lab_suite",
    "lab_suite.builtin",
    "lab_capabilities",
    "lab_capabilities.governance",
]

# ship the contract schemas as package data so an installed wheel is
# self-contained (no AXOR_LAB_CONTRACTS needed outside a checkout). The source
# of truth is contracts/schemas/; lab_contracts/schemas/ is a build-time copy
# kept byte-identical by tests/test_packaging.py.
[tool.setuptools.package-data]
lab_contracts = ["schemas/*.schema.json"]

[project.optional-dependencies]
# `byok` is retired. It drove a model against SIMULATED tools, so the numbers
# described neither the caller's agent nor their tools — a run that closed no
# user story. Kept as an empty alias so an existing
# `pip install axor-lab[byok]` keeps resolving.
byok = []
# Ed25519 license + bundle signing (same crypto as the Control Plane license)
crypto = ["pynacl>=1.5"]
# `kernel` is retired: axor-core moved to [project.dependencies]. Kept as an
# empty alias so `pip install axor-lab[kernel]` in an existing script keeps
# working instead of erroring on an unknown extra.
kernel = []

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# meaningful correctness rules (pyflakes + bugbear + comprehensions), not style
# noise; the codebase uses dict[str, object] at contract boundaries by design.
select = ["F", "E9", "B", "C4", "UP032", "PLE"]
ignore = ["B008", "B905", "C401", "C408"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "F841"]
